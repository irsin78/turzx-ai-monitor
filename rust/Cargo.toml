[package]
name = "turzx-dashboard"
version = "0.1.1"
edition = "2024"

[dependencies]
ab_glyph = { version = "0.2.32", features = ["variable-fonts"] }
anyhow = "1.0.104"
cbc = { version = "0.2.1", features = ["alloc"] }
chrono = { version = "0.4.45", features = ["unstable-locales"] }
chrono-tz = "0.10.4"
cipher = "0.5.2"
des = "0.9.0"
env_logger = "0.11.11"
futures-lite = "2.6.1"
jpeg-encoder = "0.7.1"
libloading = "0.9.0"
log = "0.4.34"
nusb = "0.2.7"
nvml-wrapper = "0.13.0"
portable-pty = "0.9.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tiny-skia = "0.12.0"
toml = "1.1.6"
ureq = { version = "3.4.2", features = ["json"] }
vt100 = "0.16.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Com", "Win32_System_Console", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
