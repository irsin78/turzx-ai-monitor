name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write # attach the exe to releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: rust
        env:
          TURZX_MASCOTS: "off"
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: turzx-dashboard
          path: rust/target/release/turzx-dashboard.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rust/target/release/turzx-dashboard.exe
          generate_release_notes: true
